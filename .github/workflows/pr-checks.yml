name: Directory PR checks

on:
  pull_request:
    paths:
      - "directory.json"
      - "app/**"
      - "components/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.js"
      - "tsconfig.json"
      - ".github/workflows/pr-checks.yml"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate listing data
        run: pnpm run validate:data

      - name: Build
        run: pnpm run build
