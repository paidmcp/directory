name: Endpoint health

# Daily check that every listed endpoint still answers MCP and still asks for
# x402 payment. Keeps one open issue (label "endpoint-health") up to date while
# anything fails and closes it once everything passes again.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: endpoint-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check all listings
        id: check
        continue-on-error: true
        run: node scripts/check-endpoints.mjs --report "$RUNNER_TEMP/report.md"

      - name: Update health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Listing endpoints failing health check"
          existing=$(gh issue list --label endpoint-health --state open --json number --jq '.[0].number // empty')

          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "All listed endpoints passed the health check: $RUN_URL"
            fi
            exit 0
          fi

          {
            echo "The daily endpoint check found listings that are down or no longer match \`directory.json\`."
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "Last run: $RUN_URL"
            echo
            echo "Reach out to the maintainers of failing listings, and remove listings that stay down."
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh label create endpoint-health --color B60205 \
              --description "Listed endpoint failing the daily health check" --force
            gh issue create --title "$title" --label endpoint-health --body-file "$RUNNER_TEMP/body.md"
          fi
