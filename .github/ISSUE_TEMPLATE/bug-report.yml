name: Bug report
description: Something on paidmcp.dev doesn't work as expected.
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://paidmcp.dev/
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS
